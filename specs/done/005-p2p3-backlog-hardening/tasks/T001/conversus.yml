mode: cooperative
target:
  - conversus/templates/winner-take-all/arbitration.md
  - conversus/templates/red-blue/arbitration.md
  - conversus/templates/prisoners-dilemma/arbitration.md
  - conversus/templates/cooperative/arbitration.md
output: conversus/specs/005-p2p3-backlog-hardening/tasks/T001/
iterations: 1

# Consensus gate: validates T001 — draft markers on non-cooperative templates
# Verification task — confirms pre-existing FR-001 is intact

agents:
  - name: compliance
    prompt: |
      You are a spec-compliance auditor verifying FR-001.

      TASK: T001 — Verify draft markers exist as first line of three
      non-cooperative arbitration templates.

      REQUIREMENT: FR-001 — Templates winner-take-all/arbitration.md,
      red-blue/arbitration.md, and prisoners-dilemma/arbitration.md MUST
      contain <!-- CONVERSUS:TEMPLATE_STATUS: draft --> as their first line.

      Check:
      1. Does each of the three non-cooperative templates have the exact
         draft marker as its first line?
      2. Does cooperative/arbitration.md NOT have the draft marker?
      3. Is the marker syntax exactly correct (HTML comment, no typos)?
    docs:
      - conversus/specs/005-p2p3-backlog-hardening/spec.md

  - name: scope-creep
    prompt: |
      You are a scope-creep detector. This is a VERIFICATION-ONLY task.
      No files should have been modified.

      TASK SCOPE: T001 — Read and verify. Zero changes expected.

      Flag if found:
      - Any modification to template files
      - Any new files created
      - Any content changes anywhere
      - Anything beyond reading and confirming the markers exist
    docs:
      - conversus/specs/005-p2p3-backlog-hardening/tasks.md
