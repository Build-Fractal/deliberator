mode: cooperative
target:
  - conversus/SKILL.md
output: conversus/specs/005-p2p3-backlog-hardening/tasks/T005/
iterations: 1

# Consensus gate: validates T005 — Baseline Features documentation
# Verification task — confirms pre-existing FR-018 is intact

agents:
  - name: compliance
    prompt: |
      You are a spec-compliance auditor verifying FR-018.

      TASK: T005 — Verify SKILL.md Baseline Features section documents
      organic pre-spec features as the stable baseline.

      REQUIREMENT: FR-018 — Organic SKILL.md features (context mechanism,
      iterations field, path-list formatting rules, multi-file target
      resolution) MUST be documented as the stable baseline that specs
      extend, with references to their SKILL.md locations.

      Check:
      1. Does a "Baseline Features" section exist in SKILL.md?
      2. Does it list the iterations field?
      3. Does it list the prior: context mechanism?
      4. Does it list path-list formatting rules?
      5. Does it list multi-file target resolution?
      6. Are these described as stable interfaces?
      7. Does it reference template variables, background dispatch, and
         multi-agent rules?
    docs:
      - conversus/specs/005-p2p3-backlog-hardening/spec.md

  - name: scope-creep
    prompt: |
      You are a scope-creep detector. This is a VERIFICATION-ONLY task.
      No files should have been modified.

      TASK SCOPE: T005 — Read and verify. Zero changes expected.

      Flag if found:
      - Any modification to SKILL.md
      - Any new files created
      - Anything beyond reading and confirming the baseline docs exist
    docs:
      - conversus/specs/005-p2p3-backlog-hardening/tasks.md
