# Mode schema: mechanism-design
# Defines mode-specific template requirements for mechanism design deliberation.
# Designing the rules of a system so participants can't game it.

mode: mechanism-design

# Mode-specific variables (required in addition to universal variables from variables.yml)
# Mechanism design mode has NO mode-specific variables beyond the universal set.
variables: []

# Phases where {MODE} variable appears in this mode's templates
mode_in_phases:
  - review
  - cross-review
  - revision
  - disputes
  - synthesis
  - arbitration
  - cross-round-synthesis

# Templates expected for this mode
templates:
  - review
  - cross-review
  - revision
  - disputes
  - synthesis
  - arbitration
  - cross-round-synthesis

# Dispute-Parsing Subsystem interface
disputes:
  synthesis_heading: "### Mechanism Vulnerabilities"
  entry_pattern: "**Vulnerability:"
  structural_markers: true  # DISPUTES_BEGIN/DISPUTES_END required in synthesis + cross-round-synthesis

# Phase 6 output validation
arbitration:
  required_headings:
    - Process Note
    - Decision Framework
    - Binding Decisions
    - Summary of Mechanism Changes Required
  influence_headings:
    recommended:
      - Process Note
      - Decision Framework
      - Recommended Resolutions
      - Suggested Mechanism Changes
    advisory:
      - Process Note
      - Decision Framework
      - Advisory Opinions
      - Mechanism Considerations

# Cross-round synthesis requirements
cross_round_synthesis:
  structural_markers: true
  dispute_heading: "### Mechanism Vulnerabilities"
