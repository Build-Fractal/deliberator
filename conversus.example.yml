# Example conversus configuration
#
# Usage:
#   conversus run conversus.example.yml --provider mock
#   conversus run conversus.example.yml --provider ollama

subject: "Conversus Architecture Review"
question: |
  Review the conversus README and evaluate whether the project
  documentation is clear, complete, and ready for open-source release.

mode: cooperative
iterations: 1

target: README.md

output: example-output/

agents:
  - name: clarity-reviewer
    prompt: |
      You are a documentation clarity expert. Review the README for
      readability, logical flow, and completeness. Is the quickstart
      achievable in under 60 seconds? Are the provider descriptions
      clear enough for a first-time user?

  - name: technical-reviewer
    prompt: |
      You are a systems architect. Review the README for technical
      accuracy. Are the provider descriptions correct? Is the pipeline
      description accurate? Are there any misleading claims?

  - name: adoption-reviewer
    prompt: |
      You are a developer relations expert. Review the README from
      the perspective of someone discovering this project for the
      first time. Would you star this repo? What's missing that
      would make you try it immediately?
