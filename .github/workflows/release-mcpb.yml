name: Build and release .mcpb bundles

# Triggers on tag push (e.g., `v0.1.0`) OR manual dispatch for testing.
# Produces a platform-specific .mcpb for each native runner and attaches
# them to a GitHub Release named after the tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g., v0.1.0-rc1). Required for manual runs.'
        required: true
        type: string

permissions:
  contents: write  # needed to create releases and upload assets

jobs:
  build:
    name: Build ${{ matrix.bundle_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            bundle_name: deliberator-darwin-arm64.mcpb
            platform: darwin
            arch: arm64
          - runner: ubuntu-latest
            bundle_name: deliberator-linux-x86_64.mcpb
            platform: linux
            arch: x86_64
          - runner: windows-latest
            bundle_name: deliberator-win-x86_64.mcpb
            platform: win32
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deliberator + dependencies into bundle
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --target desktop-extension/server/lib \
            --upgrade \
            "." \
            "mcp[cli]>=1.0.0"

      - name: Copy mcp_server.py into bundle
        shell: bash
        run: |
          cp mcp_server.py desktop-extension/server/mcp_server.py

      - name: Copy runtime data files into bundle
        shell: bash
        run: |
          # The engine needs these non-Python directories at runtime:
          # - presets/  → agent preset YAML files (pragmatist, devils-advocate, etc.)
          # - schema/   → variables.yml, modes/*.yml for template validation
          # - templates/ → per-mode prompt templates for all 5 phases
          # pip install --target only installs Python packages, not these.
          cp -r presets desktop-extension/server/presets
          cp -r schema desktop-extension/server/schema
          cp -r templates desktop-extension/server/templates

      - name: Sync manifest version + platform + tools[] from registry
        shell: bash
        run: |
          # Constitution Principle XXII (Distribution Surface Integrity, v2.3.0):
          # version single-sourced from pyproject.toml; tools[] single-sourced
          # from the capability registry. Hand-editing either is prohibited.
          python - <<'PY'
          import json
          import sys
          import tomllib
          from pathlib import Path

          # Repo root is the working dir at this CI step. Add it so we can
          # import capabilities + deliberator.registry.projector directly.
          sys.path.insert(0, str(Path(".").resolve()))

          from capabilities import CAPABILITIES
          from deliberator.registry.projector import project_to_mcpb_manifest_tools

          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          version = pyproject["project"]["version"]
          projected_tools = [dict(e) for e in project_to_mcpb_manifest_tools(CAPABILITIES)]

          path = Path("desktop-extension/manifest.json")
          manifest = json.loads(path.read_text())
          manifest["version"] = version
          manifest["compatibility"]["platforms"] = ["${{ matrix.platform }}"]
          manifest["tools"] = projected_tools
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          print(f"manifest.json synced — version={version}, platform=${{ matrix.platform }}, tools={len(projected_tools)}")
          PY

      - name: Prune __pycache__ from bundle
        shell: bash
        run: |
          find desktop-extension/server -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
          find desktop-extension/server -type f -name '*.pyc' -delete 2>/dev/null || true

      - name: Build .mcpb archive
        shell: bash
        run: |
          cd desktop-extension
          BUNDLE="${{ matrix.bundle_name }}"
          BASE="${BUNDLE%.mcpb}"
          python - <<PY
          import shutil
          shutil.make_archive("../${BASE}", "zip", ".")
          PY
          # make_archive writes .zip; rename to .mcpb
          mv "../${BASE}.zip" "../${BUNDLE}"
          ls -lh "../${BUNDLE}"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.bundle_name }}
          path: ${{ matrix.bundle_name }}
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all bundle artifacts
        uses: actions/download-artifact@v8
        with:
          path: bundles

      - name: Flatten artifact directory
        run: |
          # download-artifact@v4 creates bundles/<artifact-name>/<file>.
          # Our artifact names match the file names, so -type f is critical
          # to avoid matching (and moving) the wrapper directories.
          find bundles -type f -name '*.mcpb' -exec mv {} . \;
          ls -lh *.mcpb

      - name: Determine tag name
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Deliberator ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            deliberator-darwin-arm64.mcpb
            deliberator-linux-x86_64.mcpb
            deliberator-win-x86_64.mcpb
          body: |
            ## Desktop Extensions

            Self-contained `.mcpb` bundles for Claude Desktop. Download the one for your platform and double-click to install — no separate Python or `pip install` required.

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `deliberator-darwin-arm64.mcpb` |
            | Linux (x86_64) | `deliberator-linux-x86_64.mcpb` |
            | Windows (x86_64) | `deliberator-win-x86_64.mcpb` |

            **Intel Mac users**: install via `pip install git+https://github.com/Build-Fractal/deliberator.git` — GitHub has deprecated free Intel Mac CI runners. Let us know if you need a signed Intel Mac build.

            ## Install

            1. Download the bundle for your OS
            2. Double-click the file, or drag it into Claude Desktop → Settings → Extensions → Install from file
            3. The `deliberator_validate`, `deliberator_run`, and `deliberator_decide` tools appear in Claude Desktop

            ## Other install methods

            - **Python CLI**: `pip install git+https://github.com/Build-Fractal/deliberator.git`
            - **Claude Code plugin**: `/plugin install https://github.com/Build-Fractal/deliberator`
            - **MCP server** (any MCP-compatible editor): `claude mcp add deliberator -- deliberator mcp`
